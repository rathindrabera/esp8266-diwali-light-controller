name: Build ESP8266 Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile Sketch and Export Binary
        uses: arduino/compile-sketches@v1
        with:
          sketch-paths: |
            - diwali_light_controller_v7
          fqbn: esp8266:esp8266:nodemcuv2
          platforms: |
            - name: esp8266:esp8266
              source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          cli-compile-flags: |
            - --export-binaries

      - name: Verify Exported BIN File
        run: |
          find diwali_light_controller_v7 -name "*.bin"

      - name: Upload Compiled BIN
        uses: actions/upload-artifact@v4
        with:
          name: diwali-firmware-bin
          path: diwali_light_controller_v7/**/*.bin
